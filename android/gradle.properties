# AndroidX is required for every artifact the app uses (appcompat, material,
# core-ktx), and Compose projects need it too -- so it is on unconditionally.
android.useAndroidX=true

# Resource classes stay per-module, which is the AGP 8 default and keeps
# the build from doing transitive R-class work it does not need.
android.nonTransitiveRClass=true

# aapt2 is provided by the SDK's ARM64 build-tools on this toolchain and is
# configured globally; nothing here should override that.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
